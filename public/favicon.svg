<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%" fx="45%" fy="45%">
      <stop offset="0%" stopColor="#15243b" />
      <stop offset="60%" stopColor="#0d1728" />
      <stop offset="100%" stopColor="#060b13" />
    </radialGradient>

    <!-- Outer Gold Frame Gradient -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE08B" />
      <stop offset="25%" stopColor="#D97706" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="75%" stopColor="#B45309" />
      <stop offset="100%" stopColor="#FCD34D" />
    </linearGradient>

    <!-- Inner Metallic Rim Gradient -->
    <linearGradient id="innerRim" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#78350F" />
      <stop offset="40%" stopColor="#B45309" />
      <stop offset="70%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#FDE68A" />
    </linearGradient>

    <!-- Glowing Cup Neon Gradient -->
    <linearGradient id="cupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2A3" />
      <stop offset="50%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Border Glow -->
    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#D97706" stroke-width="26" opacity="0.35" filter="url(#borderGlow)" />

  <!-- Outer Metallic Gold Rounded Frame -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="url(#goldFrame)" stroke-width="26" />

  <!-- Inner Dark Blue Circuit Board Base -->
  <rect x="42" y="42" width="428" height="428" rx="98" fill="url(#bgGrad)" stroke="url(#innerRim)" stroke-width="4" />

  <!-- Circuit Board Decorative Micro-Traces (PCB lines) -->
  <g stroke="#264166" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <!-- Top-left traces -->
    <path d="M 68 140 H 120 L 150 170 V 210" />
    <path d="M 120 70 V 110 L 160 150 H 180" />
    <path d="M 80 200 H 130 L 160 230" />
    <path d="M 70 280 H 110 L 140 250 V 230" />

    <!-- Top-right traces -->
    <path d="M 444 140 H 392 L 362 170 V 200" />
    <path d="M 392 70 V 110 L 352 150 H 332" />
    <path d="M 432 200 H 382 L 360 222" />

    <!-- Bottom-left traces -->
    <path d="M 70 340 H 130 L 160 370 H 180" />
    <path d="M 120 442 V 400 L 150 370" />
    <path d="M 90 390 H 130 L 170 430" />
    <path d="M 190 442 V 410 L 220 380" />

    <!-- Bottom-right traces -->
    <path d="M 442 340 H 382 L 352 370 H 332" />
    <path d="M 392 442 V 400 L 362 370" />
    <path d="M 422 390 H 382 L 342 430" />
    <path d="M 322 442 V 410 L 292 380" />

    <!-- Additional Organic Flow PCB Waves -->
    <path d="M 160 80 Q 200 110 240 80" />
    <path d="M 272 80 Q 312 110 352 80" />
    <path d="M 180 430 Q 256 400 332 430" />
    <path d="M 80 160 Q 110 180 80 220" />
    <path d="M 432 160 Q 402 180 432 220" />
  </g>

  <!-- Circuit Solder Nodes / Dots -->
  <g fill="#F59E0B" opacity="0.6">
    <circle cx="150" cy="210" r="4.5" />
    <circle cx="180" cy="150" r="4.5" />
    <circle cx="160" cy="230" r="3.5" />
    <circle cx="362" cy="200" r="4.5" />
    <circle cx="332" cy="150" r="4.5" />
    <circle cx="180" cy="370" r="4" />
    <circle cx="332" cy="370" r="4" />
    <circle cx="220" cy="380" r="3.5" />
    <circle cx="292" cy="380" r="3.5" />
  </g>

  <!-- Secondary Blue Circuit Nodes -->
  <g fill="#38BDF8" opacity="0.45">
    <circle cx="120" cy="70" r="3.5" />
    <circle cx="392" cy="70" r="3.5" />
    <circle cx="68" cy="140" r="3" />
    <circle cx="444" cy="140" r="3" />
    <circle cx="120" cy="442" r="3.5" />
    <circle cx="392" cy="442" r="3.5" />
  </g>

  <!-- Central Glowing Golden Coffee Cup & Steam -->
  <g filter="url(#neonGlow)">
    <!-- 3 Steam Curves -->
    <g stroke="url(#cupGold)" stroke-width="17" stroke-linecap="round" fill="none">
      <!-- Left Steam -->
      <path d="M 218 208 C 210 190, 224 175, 216 152 C 214 146, 218 136, 215 130" />
      <!-- Center Steam -->
      <path d="M 264 208 C 256 190, 270 175, 262 152 C 260 146, 264 136, 261 130" />
      <!-- Right Steam -->
      <path d="M 310 208 C 302 190, 316 175, 308 152 C 306 146, 310 136, 307 130" />
    </g>

    <!-- Cup Body (Flat top rim, rounded deep U-bottom) -->
    <path 
      d="M 184 236 H 344 V 298 C 344 338, 314 366, 264 366 C 214 366, 184 338, 184 298 Z" 
      fill="none" 
      stroke="url(#cupGold)" 
      stroke-width="19" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Cup Handle (Ergonomic curved loop on the right) -->
    <path 
      d="M 344 250 C 388 250, 412 274, 412 298 C 412 324, 386 346, 344 346" 
      fill="none" 
      stroke="url(#cupGold)" 
      stroke-width="18" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Extra Fine Center Highlight -->
  <g stroke="#FFFBEB" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M 194 242 H 334" />
    <path d="M 262 204 C 258 190, 268 178, 262 154" />
  </g>
</svg>
